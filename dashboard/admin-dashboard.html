<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 transition-colors duration-300" id="body">

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-blue-900 text-white p-6 space-y-6">
        <h2 class="text-2xl font-bold">CBSHMS</h2>

        <nav class="space-y-4">
            <a href="#" class="block hover:text-gray-300">Dashboard</a>
            <a href="#" class="block hover:text-gray-300">Users</a>
            <a href="#" class="block hover:text-gray-300">Appointments</a>
        </nav>

        <button onclick="toggleDarkMode()" 
            class="mt-6 bg-white text-blue-900 px-3 py-2 rounded w-full">
            Toggle Dark Mode
        </button>

        <button onclick="logout()" 
            class="bg-red-600 px-3 py-2 rounded w-full mt-4">
            Logout
        </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-10">

        <h1 class="text-3xl font-bold text-blue-900 mb-8">
            Admin Dashboard
        </h1>

        <!-- USERS -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <h2 class="text-xl font-bold mb-4">All Users</h2>

            <table class="w-full border">
                <thead>
                    <tr class="bg-blue-100">
                        <th class="border p-2">Name</th>
                        <th class="border p-2">Email</th>
                        <th class="border p-2">Role</th>
                        <th class="border p-2">Action</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>

        <!-- APPOINTMENTS -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">All Appointments</h2>

            <table class="w-full border">
                <thead>
                    <tr class="bg-blue-100">
                        <th class="border p-2">Patient</th>
                        <th class="border p-2">Doctor</th>
                        <th class="border p-2">Date</th>
                        <th class="border p-2">Time</th>
                        <th class="border p-2">Status</th>
                        <th class="border p-2">Change Status</th>
                    </tr>
                </thead>
                <tbody id="adminAppointmentTable"></tbody>
            </table>
        </div>

    </main>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
    protectDashboard("admin");
    loadAllUsers();
    loadAllAppointments();
</script>

<script>
function toggleDarkMode() {
    document.getElementById("body").classList.toggle("bg-gray-900");
    document.getElementById("body").classList.toggle("text-white");
}
</script>

</body>
</html>
