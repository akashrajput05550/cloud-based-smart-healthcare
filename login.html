<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

<div class="bg-white p-8 rounded shadow w-96">
    <h2 class="text-2xl font-bold mb-4">Login</h2>

    <input id="email" class="w-full border p-2 mb-3" placeholder="Email">
    <input id="password" type="password" class="w-full border p-2 mb-3" placeholder="Password">

    <button onclick="login()" 
        class="w-full bg-blue-900 text-white p-2 rounded">
        Login
    </button>
</div>

<!-- ✅ SUPABASE CONNECTION (ORDER IS IMPORTANT) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
