<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

<div class="bg-white p-8 rounded shadow w-96">
    <h2 class="text-2xl font-bold mb-4">Register</h2>

    <input id="name" class="w-full border p-2 mb-3" placeholder="Name">
    <input id="email" class="w-full border p-2 mb-3" placeholder="Email">
    <input id="password" type="password" class="w-full border p-2 mb-3" placeholder="Password">

    <select id="role" class="w-full border p-2 mb-3">
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
        <option value="admin">Admin</option>
    </select>

    <button onclick="register()" 
        class="w-full bg-blue-900 text-white p-2 rounded">
        Register
    </button>

    <p class="mt-3 text-sm">
        Already have account? 
        <a href="login.html" class="text-blue-900">Login</a>
    </p>
</div>

<!-- ✅ SUPABASE CONNECTION (VERY IMPORTANT ORDER) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
